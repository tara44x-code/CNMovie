name: Build CN.MOVIE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key (if set in repo secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.jks; fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CN.MOVIE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CN.MOVIE-apk
          path: CN.MOVIE.apk

      - name: Publish to release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VER"
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" CN.MOVIE.apk --clobber && exit 0
            else
              gh release create "$TAG" CN.MOVIE.apk --title "CN.MOVIE $VER" --notes "تطوير: مهند سات لنك" --latest && exit 0
            fi
            sleep 20
          done
          # احتياط: نرفع على آخر إصدار موجود حتى يبقى رابط التحميل يعطي أحدث نسخة
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          gh release upload "$LATEST" CN.MOVIE.apk --clobber
